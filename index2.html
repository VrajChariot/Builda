<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friday</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e8e8e8;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* ── Sidebar ── */
      #sidebar {
        width: clamp(240px, 22vw, 420px);
        min-width: 220px;
        max-width: 520px;
        flex-shrink: 0;
        background: #161616;
        border-right: 1px solid #2a2a2a;
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
        gap: 20px;
        overflow: auto;
      }

      #sidebar-resizer {
        width: 8px;
        margin-left: -4px;
        margin-right: -4px;
        flex-shrink: 0;
        cursor: col-resize;
        background: transparent;
        position: relative;
        z-index: 5;
      }

      #sidebar-resizer::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.08);
      }

      #sidebar-resizer:hover::before,
      #sidebar-resizer.dragging::before {
        background: rgba(74, 222, 128, 0.8);
      }

      #sidebar-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #sidebar-header h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #fff;
      }

      #status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #444;
        transition: background 0.3s;
        flex-shrink: 0;
      }

      #status-dot.connected {
        background: #4ade80;
      }
      #status-dot.thinking {
        background: #facc15;
        animation: pulse 1s infinite;
      }
      #status-dot.speaking {
        background: #60a5fa;
        animation: pulse 0.6s infinite;
      }
      #status-dot.listening {
        background: #f472b6;
        animation: pulse 1.2s infinite;
      }
      #status-dot.muted {
        background: #ef4444;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      #status-label {
        font-size: 12px;
        color: #666;
        letter-spacing: 0.3px;
      }

      /* ── Transcript area ── */
      #transcript-area {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        max-width: 100%;
        word-break: break-word;
      }

      .message.user {
        background: #1e1e1e;
        color: #ccc;
        border: 1px solid #2a2a2a;
        align-self: flex-end;
      }

      .message.assistant {
        background: #1a2332;
        color: #93c5fd;
        border: 1px solid #1e3a5f;
        align-self: flex-start;
      }

      .message.assistant.streaming::after {
        content: "▋";
        animation: blink 0.8s infinite;
        margin-left: 2px;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* ── Controls ── */
      #controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #btn-start {
        background: #166534;
        color: #4ade80;
      }

      #btn-start:hover:not(:disabled) {
        background: #15803d;
      }
      #btn-start.active {
        background: #14532d;
        color: #86efac;
      }

      #btn-mute {
        background: #1c1c1c;
        color: #aaa;
        border: 1px solid #2a2a2a;
      }

      #btn-mute:hover:not(:disabled) {
        background: #262626;
      }
      #btn-mute.muted {
        background: #2d1a1a;
        color: #ef4444;
        border-color: #3d1a1a;
      }

      #btn-stop {
        background: #1c1c1c;
        color: #888;
        border: 1px solid #2a2a2a;
      }

      #btn-stop:hover:not(:disabled) {
        background: #2d1a1a;
        color: #ef4444;
        border-color: #3d1a1a;
      }

      /* ── Artifact panel ── */
      #artifact-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #111;
      }

      #artifact-toolbar {
        display: none;
        padding: 10px 16px;
        background: #161616;
        border-bottom: 1px solid #2a2a2a;
        align-items: center;
        gap: 10px;
      }

      #artifact-toolbar.visible {
        display: flex;
      }

      #artifact-title {
        font-size: 13px;
        color: #888;
        flex: 1;
      }

      .toolbar-btn {
        padding: 5px 12px;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        background: #1c1c1c;
        color: #aaa;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .toolbar-btn:hover {
        background: #262626;
        color: #fff;
      }

      #artifact-frame {
        flex: 1;
        border: none;
        width: 100%;
        display: none;
        background: #111;
      }

      #artifact-frame.visible {
        display: block;
      }

      #artifact-placeholder {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #333;
      }

      #artifact-placeholder svg {
        opacity: 0.3;
      }

      #artifact-placeholder p {
        font-size: 14px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <div id="status-dot"></div>
        <h1>Friday</h1>
      </div>

      <div id="status-label">Not connected</div>

      <div id="transcript-area"></div>

      <div id="controls">
        <button class="btn" id="btn-start"><span>▶</span> Start Chat</button>
        <button class="btn" id="btn-mute" disabled>
          <span id="mute-icon">🎙</span>
          <span id="mute-label">Mute Mic</span>
        </button>
        <button class="btn" id="btn-stop" disabled><span>⏹</span> Stop</button>
      </div>
    </div>

    <div id="sidebar-resizer" aria-hidden="true"></div>

    <!-- Artifact panel -->
    <div id="artifact-panel">
      <div id="artifact-toolbar">
        <span id="artifact-title">Built App</span>
        <button class="toolbar-btn" onclick="discardArtifact()">
          ✕ Discard
        </button>
        <button class="toolbar-btn" onclick="reloadArtifact()">↺ Reload</button>
        <button class="toolbar-btn" onclick="openArtifactInTab()">
          ↗ Open
        </button>
      </div>
      <iframe
        id="artifact-frame"
        sandbox="allow-scripts allow-forms allow-modals"
      ></iframe>
      <div id="artifact-placeholder">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18M9 21V9" />
        </svg>
        <p>Say "build a todo app" to get started</p>
      </div>
    </div>

    <script>
      const WS_BASE_URL = "ws://localhost:8000";

      // ── State ──────────────────────────────────────────────────────────────────
      let chatActive = false;
      let isRecognizing = false;
      let isProcessing = false;
      let isSpeaking = false;
      let isMuted = false;
      let geminiWebSocket = null;
      let socketReadyPromise = null;
      let audioQueue = [];
      let isPlayingQueue = false;
      let currentArtifactCode = null;
      let currentAssistantMessage = null; // DOM element for streaming text
      let sidebarResizing = false;

      // ── STT setup ──────────────────────────────────────────────────────────────
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition)
        alert("Speech recognition not supported in this browser.");

      let recognition = null;

      const setupSpeechRecognition = () => {
        if (!SpeechRecognition) return;
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
          isRecognizing = true;
          setStatus("listening");
        };

        recognition.onend = () => {
          isRecognizing = false;
          // Only restart if we should be listening
          if (chatActive && !isSpeaking && !isProcessing && !isMuted) {
            startListening();
          } else if (!isSpeaking && !isProcessing) {
            setStatus(isMuted ? "muted" : "connected");
          }
        };

        recognition.onerror = (e) => {
          // "no-speech" is normal — just restart
          if (e.error !== "no-speech") {
            console.error("STT error:", e.error);
          }
          isRecognizing = false;
        };

        recognition.onresult = async (event) => {
          const transcript = event.results[0][0].transcript.trim();
          if (!transcript) return;
          addMessage("user", transcript);
          await handleTranscript(transcript);
        };
      };

      // ── Sidebar resize ────────────────────────────────────────────────────────
      const setupSidebarResizer = () => {
        const sidebar = document.getElementById("sidebar");
        const resizer = document.getElementById("sidebar-resizer");
        const minWidth = 280;
        const maxWidth = 650;

        const updateWidth = (clientX) => {
          const nextWidth = Math.min(maxWidth, Math.max(minWidth, clientX));
          sidebar.style.width = `${nextWidth}px`;
        };

        const onPointerMove = (event) => {
          if (!sidebarResizing) return;
          updateWidth(event.clientX);
        };

        const onPointerUp = () => {
          if (!sidebarResizing) return;
          sidebarResizing = false;
          resizer.classList.remove("dragging");
          document.body.style.cursor = "";
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerup", onPointerUp);
        };

        resizer.addEventListener("pointerdown", (event) => {
          sidebarResizing = true;
          resizer.classList.add("dragging");
          document.body.style.cursor = "col-resize";
          resizer.setPointerCapture(event.pointerId);
          updateWidth(event.clientX);
          window.addEventListener("pointermove", onPointerMove);
          window.addEventListener("pointerup", onPointerUp);
          event.preventDefault();
        });
      };

      // ── Listening control ──────────────────────────────────────────────────────
      const startListening = () => {
        if (
          !recognition ||
          isRecognizing ||
          !chatActive ||
          isSpeaking ||
          isProcessing ||
          isMuted
        )
          return;
        try {
          recognition.start();
        } catch (e) {
          // Already started — ignore
        }
      };

      const stopListening = () => {
        if (!recognition || !isRecognizing) return;
        recognition.stop();
      };

      // ── Mute ──────────────────────────────────────────────────────────────────
      const toggleMute = () => {
        isMuted = !isMuted;
        const btn = document.getElementById("btn-mute");
        const icon = document.getElementById("mute-icon");
        const label = document.getElementById("mute-label");

        if (isMuted) {
          stopListening();
          btn.classList.add("muted");
          icon.textContent = "🔇";
          label.textContent = "Unmute Mic";
          setStatus("muted");
        } else {
          btn.classList.remove("muted");
          icon.textContent = "🎙";
          label.textContent = "Mute Mic";
          // Resume listening if appropriate
          if (chatActive && !isSpeaking && !isProcessing) {
            startListening();
          }
        }
      };

      // ── Status display ─────────────────────────────────────────────────────────
      const setStatus = (state) => {
        const dot = document.getElementById("status-dot");
        const label = document.getElementById("status-label");

        dot.className = ""; // clear
        dot.classList.add(state);

        const labels = {
          connected: "Ready",
          listening: "Listening...",
          thinking: "Thinking...",
          speaking: "Speaking...",
          muted: "Mic muted",
        };
        label.textContent = labels[state] || state;
      };

      // ── Transcript UI ──────────────────────────────────────────────────────────
      const addMessage = (role, text) => {
        const area = document.getElementById("transcript-area");
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.textContent = text;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        return div;
      };

      const startAssistantMessage = () => {
        currentAssistantMessage = addMessage("assistant", "");
        currentAssistantMessage.classList.add("streaming");
        return currentAssistantMessage;
      };

      const appendAssistantText = (text) => {
        if (!currentAssistantMessage) startAssistantMessage();
        currentAssistantMessage.textContent +=
          (currentAssistantMessage.textContent ? " " : "") + text;
        document.getElementById("transcript-area").scrollTop =
          document.getElementById("transcript-area").scrollHeight;
      };

      const finalizeAssistantMessage = () => {
        if (currentAssistantMessage) {
          currentAssistantMessage.classList.remove("streaming");
          currentAssistantMessage = null;
        }
      };
      // ── Code Typing Animation (Loader) ───────────────────────────────────────
      const showCodeTypingLoader = () => {
        document.getElementById("artifact-placeholder").style.display = "none";
        document.getElementById("artifact-toolbar").classList.add("visible");

        const frame = document.getElementById("artifact-frame");
        frame.classList.add("visible");

        const codeSnippet = `<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: monospace; background: #0f0f0f; color: #4ade80; padding: 20px; line-height: 1.6; }
    .typing { font-weight: bold; white-space: pre-wrap; word-break: break-all; }
    .cursor { animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="typing" id="code-display"></div><span class="cursor">▋</span>
  <script>
    const codeLines = [
      "// 🚀 Building your web app...",
      "<html>",
      "<head>",
      "  <style>",
      "    body { font-family: sans-serif; background: #f5f5f5; }",
      "    .container { max-width: 800px; margin: 50px auto; }",
      "  </style>",
      "</head>",
      "<body>",
      "  <div class='container'>",
      "    <h1>✨ Your App is under construction!</h1>",
      "  </div>",
      "</body>",
      "</html>"
    ];
    let idx = 0;
    const display = document.getElementById('code-display');
    const timer = setInterval(() => {
      if (idx < codeLines.length) {
        display.textContent += (idx > 0 ? '\\n' : '') + codeLines[idx];
        idx++;
      } else {
        clearInterval(timer);
      }
    }, 100);
  <\/script>
</body>
</html>`;

        frame.srcdoc = codeSnippet;
      };
      // ── Audio queue ────────────────────────────────────────────────────────────
      const playAudioBytes = (audioBytes) => {
        if (!(audioBytes instanceof ArrayBuffer) || audioBytes.byteLength === 0)
          return Promise.resolve();
        return new Promise((resolve) => {
          const blob = new Blob([audioBytes], { type: "audio/wav" });
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.onended = () => {
            URL.revokeObjectURL(url);
            resolve();
          };
          audio.onerror = () => {
            URL.revokeObjectURL(url);
            resolve();
          };
          audio.play().catch(() => {
            URL.revokeObjectURL(url);
            resolve();
          });
        });
      };

      const playNextInQueue = async () => {
        if (isPlayingQueue || audioQueue.length === 0) return;
        isPlayingQueue = true;
        isSpeaking = true;

        // Stop mic immediately when speaking starts
        stopListening();
        setStatus("speaking");

        while (audioQueue.length > 0) {
          await playAudioBytes(audioQueue.shift());
        }

        isPlayingQueue = false;
        isSpeaking = false;

        // Resume listening after speaking finishes
        if (chatActive && !isProcessing && !isMuted) {
          setStatus("listening");
          startListening();
        } else if (isMuted) {
          setStatus("muted");
        }
      };

      const enqueueAudio = (audioBytes) => {
        audioQueue.push(audioBytes);
        playNextInQueue();
      };

      // ── WebSocket ──────────────────────────────────────────────────────────────
      const connectGeminiSocket = () => {
        if (geminiWebSocket?.readyState === WebSocket.OPEN)
          return Promise.resolve();
        if (socketReadyPromise) return socketReadyPromise;

        socketReadyPromise = new Promise((resolve, reject) => {
          const socket = new WebSocket(`${WS_BASE_URL}/talk-to-gemini`);
          socket.binaryType = "arraybuffer";
          geminiWebSocket = socket;

          socket.onopen = () => {
            setStatus("connected");
            document.getElementById("btn-mute").disabled = false;
            document.getElementById("btn-stop").disabled = false;
            resolve();
          };

          socket.onmessage = (event) => {
            // Binary = WAV audio chunk
            if (event.data instanceof ArrayBuffer) {
              enqueueAudio(event.data);
              return;
            }

            // Text = control message
            const raw = event.data;

            if (raw === "DONE") {
              finalizeAssistantMessage();
              isProcessing = false;
              // Don't restart listening here — playNextInQueue handles it
              // after all audio finishes playing
              if (!isSpeaking && !isPlayingQueue && chatActive && !isMuted) {
                setStatus("listening");
                startListening();
              }
              return;
            }

            if (raw.startsWith("ERROR:")) {
              finalizeAssistantMessage();
              addMessage("assistant", raw);
              isProcessing = false;
              if (chatActive && !isMuted) startListening();
              return;
            }

            try {
              const msg = JSON.parse(raw);

              if (msg.type === "artifact_loading") {
                showCodeTypingLoader();
                return;
              }

              // Handle Artifact/code payload from BE (HTML + LLM response)
              if (msg.type === "Artifact" && msg.Code) {
                renderArtifact(msg.Code, "Built App");
                return;
              }

              if (msg.type === "assistant_delta") {
                appendAssistantText(msg.text);
                return;
              }
            } catch {
              // Not JSON — ignore
            }
          };

          socket.onerror = () => {
            socketReadyPromise = null;
            geminiWebSocket = null;
            isProcessing = false;
            isSpeaking = false;
            setStatus("connected");
            reject(new Error("WebSocket error"));
          };

          socket.onclose = () => {
            socketReadyPromise = null;
            geminiWebSocket = null;
            isProcessing = false;
          };
        });

        return socketReadyPromise;
      };

      const closeGeminiSocket = () => {
        geminiWebSocket?.close();
        geminiWebSocket = null;
        socketReadyPromise = null;
      };

      // ── Request handling ───────────────────────────────────────────────────────
      const handleTranscript = async (transcript) => {
        if (!transcript?.trim()) return;

        isProcessing = true;
        audioQueue = [];

        // Stop mic immediately — AI is now processing
        stopListening();
        setStatus("thinking");

        if (!geminiWebSocket || geminiWebSocket.readyState !== WebSocket.OPEN) {
          setStatus("connected");
          isProcessing = false;
          return;
        }

        // Start assistant message bubble for streaming text
        startAssistantMessage();

        geminiWebSocket.send(transcript);
      };

      // ── Artifact rendering ─────────────────────────────────────────────────────
      const renderArtifact = (code, title = "Built App") => {
        if (!code || typeof code !== "string") {
          console.error("Invalid artifact code");
          return;
        }
        currentArtifactCode = code;
        document.getElementById("artifact-placeholder").style.display = "none";
        document.getElementById("artifact-toolbar").classList.add("visible");
        document.getElementById("artifact-frame").classList.add("visible");
        document.getElementById("artifact-title").textContent = title;
        document.getElementById("artifact-frame").srcdoc = code;
      };

      const discardArtifact = () => {
        currentArtifactCode = null;
        document.getElementById("artifact-frame").classList.remove("visible");
        document.getElementById("artifact-toolbar").classList.remove("visible");
        document.getElementById("artifact-placeholder").style.display = "flex";
        document.getElementById("artifact-title").textContent = "Built App";
        document.getElementById("artifact-frame").srcdoc = "";
        if (isProcessing) {
          setStatus("thinking");
        } else if (chatActive && !isMuted) {
          setStatus("listening");
        } else if (isMuted) {
          setStatus("muted");
        } else {
          setStatus("connected");
        }
      };

      const reloadArtifact = () => {
        if (currentArtifactCode) {
          showCodeTypingLoader();
          setTimeout(() => renderArtifact(currentArtifactCode), 1500);
        }
      };

      const openArtifactInTab = () => {
        if (!currentArtifactCode) return;
        const blob = new Blob([currentArtifactCode], { type: "text/html" });
        window.open(URL.createObjectURL(blob), "_blank");
      };

      // ── Button wiring ──────────────────────────────────────────────────────────
      setupSpeechRecognition();
      setupSidebarResizer();

      document
        .getElementById("btn-start")
        .addEventListener("click", async () => {
          if (chatActive) return;
          chatActive = true;
          const btn = document.getElementById("btn-start");
          btn.classList.add("active");
          btn.querySelector("span").textContent = "●";
          btn.childNodes[1].textContent = " Connected";

          try {
            await connectGeminiSocket();
            if (!isMuted) startListening();
          } catch {
            chatActive = false;
            btn.classList.remove("active");
            setStatus("connected");
            addMessage("assistant", "Could not connect to server.");
          }
        });

      document.getElementById("btn-mute").addEventListener("click", toggleMute);

      document.getElementById("btn-stop").addEventListener("click", () => {
        chatActive = false;
        isMuted = false;
        audioQueue = [];
        isSpeaking = false;
        isProcessing = false;

        stopListening();
        closeGeminiSocket();
        finalizeAssistantMessage();

        const btn = document.getElementById("btn-start");
        btn.classList.remove("active");
        btn.querySelector("span").textContent = "▶";
        btn.childNodes[1].textContent = " Start Chat";

        document.getElementById("btn-mute").disabled = true;
        document.getElementById("btn-mute").classList.remove("muted");
        document.getElementById("mute-icon").textContent = "🎙";
        document.getElementById("mute-label").textContent = "Mute Mic";
        document.getElementById("btn-stop").disabled = true;
        document.getElementById("status-dot").className = "";
        document.getElementById("status-label").textContent = "Not connected";
      });
    </script>
  </body>
</html>
