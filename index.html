<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="speech-to-text">Start chat</button>
    <div id="transcript"></div>
    <button id="stop-chat">Stop Chat</button>
    <span id="response"></span>
    <script>
      const WS_BASE_URL = "ws://localhost:8000";

      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser.");
      }

      let recognition = null;
      let chatActive = false;
      let isRecognizing = false;
      let isProcessing = false;
      let isSpeaking = false;
      let shouldAutoRestart = true;
      let geminiWebSocket = null;
      let socketReadyPromise = null;
      let pendingResponseResolve = null;
      let pendingResponseReject = null;
      let currentAudio = null;
      let currentAudioUrl = null;

      const cleanupCurrentAudio = () => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        if (currentAudioUrl) {
          URL.revokeObjectURL(currentAudioUrl);
          currentAudioUrl = null;
        }
      };

      const detectAudioMimeType = (audioBytes) => {
        const bytes = new Uint8Array(audioBytes);
        if (
          bytes.length >= 12 &&
          bytes[0] === 0x52 &&
          bytes[1] === 0x49 &&
          bytes[2] === 0x46 &&
          bytes[3] === 0x46 &&
          bytes[8] === 0x57 &&
          bytes[9] === 0x41 &&
          bytes[10] === 0x56 &&
          bytes[11] === 0x45
        ) {
          return "audio/wav";
        }

        if (
          bytes.length >= 3 &&
          bytes[0] === 0x49 &&
          bytes[1] === 0x44 &&
          bytes[2] === 0x33
        ) {
          return "audio/mpeg";
        }

        if (
          bytes.length >= 2 &&
          bytes[0] === 0xff &&
          (bytes[1] & 0xe0) === 0xe0
        ) {
          return "audio/mpeg";
        }

        return "audio/wav";
      };

      const playAudioBytes = (audioBytes) => {
        if (!(audioBytes instanceof ArrayBuffer) || audioBytes.byteLength === 0)
          return Promise.resolve();
        return new Promise((resolve) => {
          cleanupCurrentAudio();
          const audioMimeType = detectAudioMimeType(audioBytes);
          const blob = new Blob([audioBytes], { type: audioMimeType });
          currentAudioUrl = URL.createObjectURL(blob);
          currentAudio = new Audio(currentAudioUrl);

          isSpeaking = true;
          currentAudio.onended = () => {
            isSpeaking = false;
            cleanupCurrentAudio();
            resolve();
          };
          currentAudio.onerror = () => {
            isSpeaking = false;
            cleanupCurrentAudio();
            resolve();
          };
          currentAudio.play().catch(() => {
            isSpeaking = false;
            cleanupCurrentAudio();
            resolve();
          });
        });
      };

      const closeGeminiSocket = () => {
        if (geminiWebSocket) {
          geminiWebSocket.close();
        }
        geminiWebSocket = null;
        socketReadyPromise = null;
      };

      const connectGeminiSocket = () => {
        if (geminiWebSocket && geminiWebSocket.readyState === WebSocket.OPEN) {
          return Promise.resolve();
        }

        if (socketReadyPromise) return socketReadyPromise;

        socketReadyPromise = new Promise((resolve, reject) => {
          const socket = new WebSocket(`${WS_BASE_URL}/talk-to-gemini`);
          socket.binaryType = "arraybuffer";
          geminiWebSocket = socket;

          socket.onopen = () => {
            document.getElementById("response").textContent =
              "Connected to server.";
            resolve();
          };

          socket.onmessage = (event) => {
            if (pendingResponseResolve) {
              pendingResponseResolve(event.data);
              pendingResponseResolve = null;
              pendingResponseReject = null;
            }
          };

          socket.onerror = () => {
            if (pendingResponseReject) {
              pendingResponseReject(new Error("WebSocket error"));
              pendingResponseResolve = null;
              pendingResponseReject = null;
            }
            if (chatActive) {
              chatActive = false;
              stopListening();
              document.getElementById("response").textContent =
                "Socket error. Chat stopped.";
            }
            reject(new Error("WebSocket error"));
          };

          socket.onclose = () => {
            socketReadyPromise = null;
            geminiWebSocket = null;
            if (pendingResponseReject) {
              pendingResponseReject(new Error("WebSocket closed"));
              pendingResponseResolve = null;
              pendingResponseReject = null;
            }
          };
        });

        return socketReadyPromise;
      };

      const fetchGeminiResponse = async (transcript) => {
        await connectGeminiSocket();

        return new Promise((resolve, reject) => {
          if (
            !geminiWebSocket ||
            geminiWebSocket.readyState !== WebSocket.OPEN
          ) {
            reject(new Error("WebSocket is not connected"));
            return;
          }

          if (pendingResponseResolve) {
            reject(new Error("Previous request still pending"));
            return;
          }

          pendingResponseResolve = resolve;
          pendingResponseReject = reject;
          // geminiWebSocket.send(JSON.stringify({ transcript }));
          geminiWebSocket.send(transcript);
        });
      };

      const stopListening = () => {
        if (!recognition || !isRecognizing) return;
        shouldAutoRestart = false;
        recognition.stop();
      };

      const startListening = () => {
        if (
          !recognition ||
          isRecognizing ||
          !chatActive ||
          isSpeaking ||
          isProcessing
        )
          return;
        shouldAutoRestart = true;
        recognition.start();
      };

      const postTranscriptAndSpeakResponse = async (transcript) => {
        if (!transcript || !transcript.trim()) return;
        isProcessing = true;
        stopListening();

        try {
          const audioBytes = await fetchGeminiResponse(transcript);
          if (
            typeof audioBytes === "string" &&
            audioBytes.startsWith("ERROR:")
          ) {
            document.getElementById("response").textContent = audioBytes;
            return;
          }
          document.getElementById("response").textContent = "Playing audio...";
          await playAudioBytes(audioBytes);
          document.getElementById("response").textContent = "Ready";
        } catch (error) {
          document.getElementById("response").textContent =
            "Could not get response from server.";
          console.error(error);
        } finally {
          isProcessing = false;
          if (chatActive) startListening();
        }
      };

      const setupSpeechRecognition = () => {
        if (!SpeechRecognition) return;
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
          isRecognizing = true;
        };

        recognition.onend = () => {
          isRecognizing = false;
          if (chatActive && shouldAutoRestart && !isSpeaking && !isProcessing) {
            startListening();
          }
          shouldAutoRestart = true;
        };

        recognition.onerror = (event) => {
          console.error("Speech recognition error:", event.error);
        };

        recognition.onresult = async (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById("transcript").textContent = transcript;
          await postTranscriptAndSpeakResponse(transcript);
        };
      };

      setupSpeechRecognition();

      const button = document.getElementById("speech-to-text");
      button.addEventListener("click", async () => {
        chatActive = true;
        try {
          await connectGeminiSocket();
        } catch (error) {
          chatActive = false;
          document.getElementById("response").textContent =
            "Could not connect to websocket.";
          console.error(error);
          return;
        }
        startListening();
      });

      const stopButton = document.getElementById("stop-chat");
      stopButton.addEventListener("click", () => {
        chatActive = false;
        stopListening();
        cleanupCurrentAudio();
        closeGeminiSocket();
        document.getElementById("response").textContent = "Stopped";
      });
    </script>
  </body>
</html>
