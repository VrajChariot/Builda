<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="speech-to-text">Start chat</button>
    <div id="transcript"></div>
    <button id="stop-chat">Stop Chat</button>
    <span id="response"></span>
    <script>
      const WS_BASE_URL = "ws://localhost:8000";
      const INPUT_SAMPLE_RATE = 16000;
      const OUTPUT_SAMPLE_RATE = 24000;
      const SCRIPT_BUFFER_SIZE = 2048;
      const VAD_RMS_THRESHOLD = 0.012;
      const VAD_SILENCE_MS = 700;
      const MIN_SPEECH_MS = 180;
      const POST_SPEECH_TAIL_MS = 220;

      let chatActive = false;
      let geminiWebSocket = null;
      let socketReadyPromise = null;
      let audioContext = null;
      let micStream = null;
      let micSourceNode = null;
      let micProcessorNode = null;
      let micSinkGainNode = null;
      let playbackCursor = 0;
      let speechActive = false;
      let speechStartMs = 0;
      let lastSpeechMs = 0;
      let turnEnded = true;
      let hasSentAudioInTurn = false;

      const transcriptEl = document.getElementById("transcript");
      const responseEl = document.getElementById("response");

      const float32ToInt16Buffer = (floatBuffer) => {
        const int16 = new Int16Array(floatBuffer.length);
        for (let i = 0; i < floatBuffer.length; i += 1) {
          const sample = Math.max(-1, Math.min(1, floatBuffer[i]));
          int16[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        return int16.buffer;
      };

      const downsampleTo16k = (input, inputSampleRate) => {
        if (inputSampleRate === INPUT_SAMPLE_RATE) {
          return input;
        }

        const ratio = inputSampleRate / INPUT_SAMPLE_RATE;
        const outLength = Math.max(1, Math.round(input.length / ratio));
        const output = new Float32Array(outLength);
        let offsetResult = 0;
        let offsetBuffer = 0;

        while (offsetResult < output.length) {
          const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
          let accum = 0;
          let count = 0;

          for (
            let i = offsetBuffer;
            i < nextOffsetBuffer && i < input.length;
            i += 1
          ) {
            accum += input[i];
            count += 1;
          }

          output[offsetResult] = count > 0 ? accum / count : 0;
          offsetResult += 1;
          offsetBuffer = nextOffsetBuffer;
        }

        return output;
      };

      const schedulePcmPlayback = (arrayBuffer) => {
        if (
          !audioContext ||
          !(arrayBuffer instanceof ArrayBuffer) ||
          arrayBuffer.byteLength === 0
        ) {
          return;
        }

        const pcm = new Int16Array(arrayBuffer);
        const floatData = new Float32Array(pcm.length);
        for (let i = 0; i < pcm.length; i += 1) {
          floatData[i] = pcm[i] / 0x8000;
        }

        const audioBuffer = audioContext.createBuffer(
          1,
          floatData.length,
          OUTPUT_SAMPLE_RATE,
        );
        audioBuffer.copyToChannel(floatData, 0);

        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);

        const now = audioContext.currentTime;
        const startAt = Math.max(now + 0.02, playbackCursor);
        source.start(startAt);
        playbackCursor = startAt + audioBuffer.duration;
      };

      const computeRms = (samples) => {
        if (!samples || samples.length === 0) return 0;
        let sumSquares = 0;
        for (let i = 0; i < samples.length; i += 1) {
          const s = samples[i];
          sumSquares += s * s;
        }
        return Math.sqrt(sumSquares / samples.length);
      };

      const sendEndTurn = () => {
        if (!geminiWebSocket || geminiWebSocket.readyState !== WebSocket.OPEN)
          return;
        if (!hasSentAudioInTurn) return;
        geminiWebSocket.send("END_TURN");
        turnEnded = true;
        hasSentAudioInTurn = false;
        responseEl.textContent = "Waiting for Gemini response...";
      };

      const closeGeminiSocket = () => {
        if (geminiWebSocket) {
          geminiWebSocket.close();
        }
        geminiWebSocket = null;
        socketReadyPromise = null;
      };

      const connectGeminiSocket = () => {
        if (geminiWebSocket && geminiWebSocket.readyState === WebSocket.OPEN) {
          return Promise.resolve();
        }

        if (socketReadyPromise) return socketReadyPromise;

        socketReadyPromise = new Promise((resolve, reject) => {
          const socket = new WebSocket(`${WS_BASE_URL}/talk-to-gemini`);
          socket.binaryType = "arraybuffer";
          geminiWebSocket = socket;

          socket.onopen = () => {
            responseEl.textContent = "Connected. Streaming audio...";
            resolve();
          };

          socket.onmessage = (event) => {
            if (typeof event.data === "string") {
              responseEl.textContent = event.data;
              return;
            }

            schedulePcmPlayback(event.data);
          };

          socket.onerror = () => {
            if (chatActive) {
              chatActive = false;
              stopAudioStreaming();
              responseEl.textContent = "Socket error. Chat stopped.";
            }
            reject(new Error("WebSocket error"));
          };

          socket.onclose = () => {
            socketReadyPromise = null;
            geminiWebSocket = null;
            responseEl.textContent = chatActive ? "Disconnected." : "Stopped";
          };
        });

        return socketReadyPromise;
      };

      const startAudioStreaming = async () => {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          throw new Error("Web Audio API is not supported in this browser.");
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Microphone access is not supported in this browser.",
          );
        }

        if (!audioContext) {
          audioContext = new AudioContextClass({
            sampleRate: INPUT_SAMPLE_RATE,
          });
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });

        micSourceNode = audioContext.createMediaStreamSource(micStream);
        micProcessorNode = audioContext.createScriptProcessor(
          SCRIPT_BUFFER_SIZE,
          1,
          1,
        );
        micSinkGainNode = audioContext.createGain();
        micSinkGainNode.gain.value = 0;

        playbackCursor = audioContext.currentTime;
        speechActive = false;
        speechStartMs = 0;
        lastSpeechMs = 0;
        turnEnded = true;
        hasSentAudioInTurn = false;

        micProcessorNode.onaudioprocess = (event) => {
          if (!chatActive) return;
          if (!geminiWebSocket || geminiWebSocket.readyState !== WebSocket.OPEN)
            return;

          const inputData = event.inputBuffer.getChannelData(0);
          const nowMs = performance.now();
          const rms = computeRms(inputData);
          const isSpeech = rms >= VAD_RMS_THRESHOLD;

          if (isSpeech) {
            if (!speechActive) {
              speechActive = true;
              speechStartMs = nowMs;
              turnEnded = false;
              hasSentAudioInTurn = false;
              responseEl.textContent = "Listening...";
            }
            lastSpeechMs = nowMs;
          }

          const inTailWindow =
            speechActive && nowMs - lastSpeechMs <= POST_SPEECH_TAIL_MS;
          const shouldStreamChunk = isSpeech || inTailWindow;

          if (shouldStreamChunk) {
            const downsampled = downsampleTo16k(
              inputData,
              audioContext.sampleRate,
            );
            const pcmBuffer = float32ToInt16Buffer(downsampled);

            if (pcmBuffer.byteLength > 0) {
              geminiWebSocket.send(pcmBuffer);
              hasSentAudioInTurn = true;
            }
          }

          if (speechActive && !turnEnded) {
            const spokeLongEnough = nowMs - speechStartMs >= MIN_SPEECH_MS;
            const silenceLongEnough = nowMs - lastSpeechMs >= VAD_SILENCE_MS;
            if (spokeLongEnough && silenceLongEnough) {
              speechActive = false;
              sendEndTurn();
            }
          }
        };

        micSourceNode.connect(micProcessorNode);
        micProcessorNode.connect(micSinkGainNode);
        micSinkGainNode.connect(audioContext.destination);
      };

      const stopAudioStreaming = () => {
        try {
          if (micProcessorNode) {
            micProcessorNode.disconnect();
            micProcessorNode.onaudioprocess = null;
          }
          if (micSourceNode) {
            micSourceNode.disconnect();
          }
          if (micSinkGainNode) {
            micSinkGainNode.disconnect();
          }
        } catch (error) {
          console.error("Error while stopping audio nodes:", error);
        }

        if (micStream) {
          micStream.getTracks().forEach((track) => track.stop());
        }

        micProcessorNode = null;
        micSourceNode = null;
        micSinkGainNode = null;
        micStream = null;
        speechActive = false;
        speechStartMs = 0;
        lastSpeechMs = 0;
        turnEnded = true;
        hasSentAudioInTurn = false;
      };

      const button = document.getElementById("speech-to-text");
      button.addEventListener("click", async () => {
        if (chatActive) return;
        chatActive = true;
        transcriptEl.textContent =
          "Live mode: microphone streaming to Gemini and audio streaming back.";

        try {
          await connectGeminiSocket();
          await startAudioStreaming();
          responseEl.textContent = "Listening and streaming...";
        } catch (error) {
          chatActive = false;
          stopAudioStreaming();
          closeGeminiSocket();
          responseEl.textContent = "Could not start live audio chat.";
          console.error(error);
        }
      });

      const stopButton = document.getElementById("stop-chat");
      stopButton.addEventListener("click", () => {
        chatActive = false;
        sendEndTurn();
        stopAudioStreaming();
        closeGeminiSocket();
        responseEl.textContent = "Stopped";
      });
    </script>
  </body>
</html>
